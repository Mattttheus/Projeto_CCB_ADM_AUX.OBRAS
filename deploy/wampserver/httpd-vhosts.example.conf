<VirtualHost *:80>
    ServerName obras.exemplo.com
    DocumentRoot "C:/wamp64/www/Projeto_CCB_ADM_AUX.OBRAS"

    <Directory "C:/wamp64/www/Projeto_CCB_ADM_AUX.OBRAS">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/auxiliar-obras-error.log"
    CustomLog "logs/auxiliar-obras-access.log" combined
</VirtualHost>

# Exemplo minimo para HTTPS.
# Ajuste os caminhos do certificado e habilite o modulo SSL no Apache.
<VirtualHost *:443>
    ServerName obras.exemplo.com
    DocumentRoot "C:/wamp64/www/Projeto_CCB_ADM_AUX.OBRAS"

    SSLEngine on
    SSLCertificateFile "C:/caminho/para/fullchain.pem"
    SSLCertificateKeyFile "C:/caminho/para/privkey.pem"

    <Directory "C:/wamp64/www/Projeto_CCB_ADM_AUX.OBRAS">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/auxiliar-obras-ssl-error.log"
    CustomLog "logs/auxiliar-obras-ssl-access.log" combined
</VirtualHost>
